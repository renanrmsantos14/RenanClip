[package]
name = "renanclip-desktop"
version = "0.0.1"
edition = "2021"
description = "RenanClip para PC (Tauri 2)"
build = "build.rs"

[[bin]]
name = "renanclip"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
renanclip-core = { path = "../core" }
tauri = { version = "2", default-features = false, features = ["wry", "x11", "tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
arboard = "3"
png = "0.18"
ureq = { version = "2", features = ["json"] }
ed25519-dalek = { version = "2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
