[package]
name = "renanclip-core"
version = "0.0.0"
edition = "2021"
description = "Núcleo do RenanClip: protocolo, criptografia, histórico e sincronização"
publish = false

[dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "std"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
mdns-sd = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
