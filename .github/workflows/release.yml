# Publicação do RenanClip. SÓ roda quando você dispara manualmente (Actions > Release > Run workflow).
# Não há gatilho de push nem de pull request: abrir PR ou dar push nunca executa isto.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Criar o release como rascunho (recomendado: confira os arquivos antes de publicar)"
        type: boolean
        default: true
      android:
        description: "Incluir o APK assinado do Android"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        run: |
          node scripts/bump-version.mjs
          version=$(node -p "require('./version.json').version")
          if git rev-parse "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            echo "A tag v$version já existe" >&2; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Versão v$version" -q
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: bump
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, bin: renanclip, asset: renanclip-linux-x86_64 }
          - { os: windows-2022, bin: renanclip.exe, asset: renanclip-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.bump.outputs.sha }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do Linux (Tauri + X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libx11-dev libxtst-dev libxfixes-dev librsvg2-dev
      - run: cargo test -p renanclip-core -p renanclip-desktop
      - run: cargo build --release -p renanclip-desktop
      - name: Renomear o binário
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.asset }}", path: "${{ matrix.asset }}", if-no-files-found: error }

  android:
    if: ${{ inputs.android }}
    needs: bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.bump.outputs.sha }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Conferir que o código do Android está nesta branch
        run: |
          test -d android || { echo "Sem pasta android/ nesta branch: faça o merge do PR do Android antes ou desmarque a opção android" >&2; exit 1; }
      - name: Testes e APK sem assinatura
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew assembleRelease
      - name: Assinar o APK (o keystore vem do secret e nunca entra no repositório)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          ks="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          in=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$bt/zipalign" -f -p 4 "$in" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out renanclip-android.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify renanclip-android.apk
          rm -f "$ks"
      - uses: actions/upload-artifact@v4
        with: { name: renanclip-android.apk, path: renanclip-android.apk, if-no-files-found: error }

  publish:
    needs: [bump, desktop, android]
    if: ${{ !cancelled() && needs.bump.result == 'success' && needs.desktop.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.bump.outputs.sha }}", path: src }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: SHA256SUMS e assinatura Ed25519
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -e
          cd dist
          sha256sum * > SHA256SUMS
          umask 077
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > "$RUNNER_TEMP/up.pem"
          # a chave privada tem de ser a do desktop/updater.pub, senão nenhum app instalado aceitaria o update
          got=$(openssl pkey -in "$RUNNER_TEMP/up.pem" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          want=$(xxd -p -c 64 "$GITHUB_WORKSPACE/src/desktop/updater.pub")
          [ "$got" = "$want" ] || { echo "UPDATER_PRIVATE_KEY não corresponde a desktop/updater.pub" >&2; rm -f "$RUNNER_TEMP/up.pem"; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/up.pem" -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/up.pem"
          ls -l
      - name: Criar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          if [ "${{ inputs.draft }}" = "true" ]; then flag="--draft"; fi
          gh release create "v${{ needs.bump.outputs.version }}" dist/* $flag \
            --repo "$GITHUB_REPOSITORY" --target "${{ needs.bump.outputs.sha }}" \
            --title "RenanClip v${{ needs.bump.outputs.version }}" --generate-notes
